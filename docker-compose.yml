version: '3.8'

services:
  # ==========================================================================
  # MAIN TRADING SYSTEM
  # ==========================================================================
  ai_xyz_trading:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_xyz_trading_system
    restart: unless-stopped
    environment:
      - BITGET_API_KEY=${BITGET_API_KEY}
      - BITGET_API_SECRET=${BITGET_API_SECRET}
      - BITGET_API_PASSPHRASE=${BITGET_API_PASSPHRASE}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://${DB_USER:-ai_xyz_user}:${DB_PASSWORD:-ai_xyz_pass}@postgres:5432/${DB_NAME:-ai_xyz}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - INITIAL_BALANCE=${INITIAL_BALANCE:-65.70}
      - MAX_POSITIONS=${MAX_POSITIONS:-10}
      - DEFAULT_LEVERAGE=${DEFAULT_LEVERAGE:-5}
      - POSITION_SIZE_USD=${POSITION_SIZE_USD:-10}
      - TIERED_TOTAL_CAPITAL=${TIERED_TOTAL_CAPITAL:-300}
      - TIERED_MAX_POSITIONS=${TIERED_MAX_POSITIONS:-30}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./position_state.json:/app/position_state.json
      - ./averaging_state.json:/app/averaging_state.json
      - ./continuous_trading_state.json:/app/continuous_trading_state.json
      - ./performance_history.json:/app/performance_history.json
    networks:
      - ai_xyz_network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==========================================================================
  # GRID DCA SPOT SERVICE
  # ==========================================================================
  # UNIQUE SERVICE - Dynamic Grid DCA trading for spot account
  # Features: ATR-based grid spacing, ADX/Volume filters, limit orders
  # --------------------------------------------------------------------------
  grid_dca:
    build:
      context: .
      dockerfile: Dockerfile.grid_dca
    container_name: ai_xyz_grid_dca
    restart: unless-stopped
    environment:
      - BITGET_API_KEY=${BITGET_API_KEY}
      - BITGET_API_SECRET=${BITGET_API_SECRET}
      - BITGET_API_PASSPHRASE=${BITGET_API_PASSPHRASE}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
      - ./grid_dca_state.json:/app/grid_dca_state.json
      - ./grid_trade_journal.json:/app/grid_trade_journal.json
    networks:
      - ai_xyz_network
    depends_on:
      - ai_xyz_trading

  # ==========================================================================
  # BALANCE MANAGER SERVICE
  # ==========================================================================
  # UNIQUE SERVICE - Margin management between futures and spot accounts
  # NOT a duplicate - transfers excess margin ($400 threshold, $15 increments)
  # --------------------------------------------------------------------------
  balance_manager:
    build:
      context: ./services
      dockerfile: Dockerfile.balance_manager
    container_name: ai_xyz_balance_manager
    restart: unless-stopped
    environment:
      - BITGET_API_KEY=${BITGET_API_KEY}
      - BITGET_API_SECRET=${BITGET_API_SECRET}
      - BITGET_API_PASSPHRASE=${BITGET_API_PASSPHRASE}
      - MARGIN_THRESHOLD=400
      - TRANSFER_INCREMENT=15
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
    networks:
      - ai_xyz_network
    depends_on:
      - ai_xyz_trading

  # ==========================================================================
  # DIVERSIFIED SPOT INVESTMENT SERVICE
  # ==========================================================================
  # UNIQUE SERVICE - Diversified spot portfolio (Crypto/Gold/Stocks)
  # Features: 33/33/33 allocation, VSA scanner, ONDO/RWA stock proxies
  # Runs every 4 hours, invests excess spot capital in diversified assets
  # --------------------------------------------------------------------------
  diversified_spot:
    build:
      context: .
      dockerfile: Dockerfile.diversified_spot
    container_name: ai_xyz_diversified_spot
    restart: unless-stopped
    environment:
      - BITGET_API_KEY=${BITGET_API_KEY}
      - BITGET_API_SECRET=${BITGET_API_SECRET}
      - BITGET_API_PASSPHRASE=${BITGET_API_PASSPHRASE}
      - STATE_FILE=/app/diversified_spot_state.json
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
      - ./diversified_spot_state.json:/app/diversified_spot_state.json
    networks:
      - ai_xyz_network
    depends_on:
      - balance_manager

  # ==========================================================================
  # BITGET ONCHAIN SERVICE - Tokenized Stock Trading
  # ==========================================================================
  # UNIQUE SERVICE - Trades tokenized stocks (xStocks) via Bitget Onchain API
  # Features: TSLAx, NVDAx, AAPLx, SPYx trading on Solana via Bitget Wallet
  # Requires: Partner-Code from Bitget for swap execution
  # --------------------------------------------------------------------------
  bitget_onchain:
    build:
      context: .
      dockerfile: Dockerfile.bitget_onchain
    container_name: ai_xyz_bitget_onchain
    restart: unless-stopped
    environment:
      - BITGET_API_KEY=${BITGET_API_KEY}
      - BITGET_API_SECRET=${BITGET_API_SECRET}
      - BITGET_API_PASSPHRASE=${BITGET_API_PASSPHRASE}
      - BITGET_PARTNER_CODE=${BITGET_PARTNER_CODE:-}
      - SOLANA_WALLET_ADDRESS=${SOLANA_WALLET_ADDRESS:-}
      - SOLANA_PRIVATE_KEY=${SOLANA_PRIVATE_KEY:-}
      - ONCHAIN_STATE_FILE=/app/onchain_state.json
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
      - ./onchain_state.json:/app/onchain_state.json
    networks:
      - ai_xyz_network
    depends_on:
      - diversified_spot

  # ==========================================================================
  # MICROSERVICES
  # ==========================================================================

  # --------------------------------------------------------------------------
  # DUPLICATE SERVICE - Functionality exists in main trading system
  # Reference: aixyz_continuous_profit_system.py
  #   - LiquidationProtectionService (line 64)
  #   - ATRStopLoss, TrailingATRStop (lines 50-51)
  #   - Zone-based risk management (lines 488-493)
  # --------------------------------------------------------------------------
  risk-engine:
    build:
      context: ./services/risk-engine
      dockerfile: Dockerfile
    container_name: ai_xyz_risk_engine
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    networks:
      - ai_xyz_network
    depends_on:
      - redis

  # --------------------------------------------------------------------------
  # DUPLICATE SERVICE - Functionality exists in main trading system
  # Reference: aixyz_continuous_profit_system.py
  #   - LivePositionsRegistry (line 94)
  #   - PositionPersistenceManager (line 96)
  #   - EnhancedPositionSync v1.3.0 (line 69)
  #   - Position zones management (lines 488-545)
  # --------------------------------------------------------------------------
  position-management:
    build:
      context: ./services/position-management
      dockerfile: Dockerfile
    container_name: ai_xyz_position_management
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - BITGET_API_KEY=${BITGET_API_KEY}
      - BITGET_API_SECRET=${BITGET_API_SECRET}
      - BITGET_API_PASSPHRASE=${BITGET_API_PASSPHRASE}
    networks:
      - ai_xyz_network
    depends_on:
      - redis

  # --------------------------------------------------------------------------
  # DUPLICATE SERVICE - Functionality exists in main trading system
  # Reference: aixyz_continuous_profit_system.py
  #   - ScannerV4 (line 31) - All-market intelligent scanner
  #   - EnhancedMarketScanner (line 28)
  #   - VSA scoring, two-stage filtering (497 markets)
  # --------------------------------------------------------------------------
  market-scanner:
    build:
      context: ./services/market-scanner
      dockerfile: Dockerfile
    container_name: ai_xyz_market_scanner
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - BITGET_API_KEY=${BITGET_API_KEY}
      - BITGET_API_SECRET=${BITGET_API_SECRET}
      - BITGET_API_PASSPHRASE=${BITGET_API_PASSPHRASE}
    networks:
      - ai_xyz_network
    depends_on:
      - redis

  # --------------------------------------------------------------------------
  # UNIQUE SERVICE - Historical data storage and processing
  # NOT a duplicate - provides data persistence not in main system
  # --------------------------------------------------------------------------
  data-pipeline:
    build:
      context: ./services/data-pipeline
      dockerfile: Dockerfile
    container_name: ai_xyz_data_pipeline
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://${DB_USER:-ai_xyz_user}:${DB_PASSWORD:-ai_xyz_pass}@postgres:5432/${DB_NAME:-ai_xyz}
      - BITGET_API_KEY=${BITGET_API_KEY}
      - BITGET_API_SECRET=${BITGET_API_SECRET}
      - BITGET_API_PASSPHRASE=${BITGET_API_PASSPHRASE}
    networks:
      - ai_xyz_network
    depends_on:
      - redis
      - postgres

  # --------------------------------------------------------------------------
  # DUPLICATE SERVICE - ML functionality exists in main trading system
  # Reference: aixyz_continuous_profit_system.py
  #   - RLClosingAgent (line 44) - Q-learning exit timing
  #   - MarkowitzOptimizer (line 45) - Portfolio optimization
  #   - CorrelationMatrixAnalyzer (line 46)
  #   - OpportunityCostPredictor (line 47)
  #   - V3 AI: AdaptiveThresholdEngine, AIMarketIntelligence (lines 71-75)
  # --------------------------------------------------------------------------
  ml-framework:
    build:
      context: ./services/ml-framework
      dockerfile: Dockerfile
    container_name: ai_xyz_ml_framework
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    networks:
      - ai_xyz_network
    depends_on:
      - redis

  # --------------------------------------------------------------------------
  # UNIQUE SERVICE - System metrics and health monitoring
  # NOT a duplicate - provides monitoring dashboard not in main system
  # --------------------------------------------------------------------------
  monitoring-service:
    build:
      context: ./services/monitoring-service
      dockerfile: Dockerfile
    container_name: ai_xyz_monitoring
    restart: unless-stopped
    ports:
      - "8006:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    networks:
      - ai_xyz_network
    depends_on:
      - redis

  # --------------------------------------------------------------------------
  # DUPLICATE SERVICE - Notifications handled by telegram-bot service
  # Reference: telegram-bot container (ai_xyz_telegram_bot)
  #   - Already running and handling all notifications
  # --------------------------------------------------------------------------
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: ai_xyz_notification
    restart: unless-stopped
    ports:
      - "8007:8000"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    networks:
      - ai_xyz_network

  # ==========================================================================
  # INFRASTRUCTURE SERVICES
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: ai_xyz_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - ai_xyz_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: ai_xyz_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-ai_xyz_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-ai_xyz_pass}
      - POSTGRES_DB=${DB_NAME:-ai_xyz}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_xyz_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ai_xyz_user} -d ${DB_NAME:-ai_xyz}"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ==========================================================================
  # ADDITIONAL SERVICES
  # ==========================================================================
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.telegram
    container_name: ai_xyz_telegram_bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - REDIS_URL=redis://redis:6379/0
    networks:
      - ai_xyz_network
    depends_on:
      - redis

  backtest:
    build:
      context: .
      dockerfile: Dockerfile.backtest
    container_name: ai_xyz_backtest
    restart: unless-stopped
    ports:
      - "8008:8000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-ai_xyz_user}:${DB_PASSWORD:-ai_xyz_pass}@postgres:5432/${DB_NAME:-ai_xyz}
    networks:
      - ai_xyz_network
    depends_on:
      - postgres

  # ==========================================================================
  # PREDICTION SERVICE
  # ==========================================================================
  # AI-powered price prediction service with REST API
  # Provides: Entry/exit signals, market overview, prediction validation
  # --------------------------------------------------------------------------
  prediction_service:
    build:
      context: .
      dockerfile: services/Dockerfile.prediction
    container_name: ai_xyz_prediction
    restart: unless-stopped
    environment:
      - BITGET_API_KEY=${BITGET_API_KEY}
      - BITGET_API_SECRET=${BITGET_API_SECRET}
      - BITGET_API_PASSPHRASE=${BITGET_API_PASSPHRASE}
      - PYTHONUNBUFFERED=1
    ports:
      - "8009:8009"
    volumes:
      - ./logs:/app/logs
    networks:
      - ai_xyz_network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================================================
  # QUICK SCALPER SERVICE (V1.0.0)
  # ==========================================================================
  # High-frequency RSI mean-reversion scalping for predictable symbols
  # Targets: FIL (62.1% WR), ATOM (62.9% WR) - Backtest validated
  # Strategy: RSI <25 LONG, RSI >75 SHORT, 0.3% TP, 0.2% SL, 60min max hold
  # --------------------------------------------------------------------------
  quick_scalper:
    build:
      context: .
      dockerfile: Dockerfile.quick_scalper
    container_name: ai_xyz_quick_scalper
    restart: unless-stopped
    environment:
      - BITGET_API_KEY=${BITGET_API_KEY}
      - BITGET_API_SECRET=${BITGET_API_SECRET}
      - BITGET_API_PASSPHRASE=${BITGET_API_PASSPHRASE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
    networks:
      - ai_xyz_network
    depends_on:
      redis:
        condition: service_healthy

  # ==========================================================================
  # OPPORTUNITY DISCOVERY ENGINE (V1.0.0)
  # ==========================================================================
  # Multi-factor opportunity scoring (Claude + Grok design)
  # Scans volatile symbols, scores by RSI + Volume + Momentum + Volatility
  # Backtest: DASH 72.1% WR, 3.41 PF | Overall +16.23% on 168 trades
  # --------------------------------------------------------------------------
  opportunity_engine:
    build:
      context: .
      dockerfile: Dockerfile.opportunity_engine
    container_name: ai_xyz_opportunity_engine
    restart: unless-stopped
    environment:
      - BITGET_API_KEY=${BITGET_API_KEY}
      - BITGET_API_SECRET=${BITGET_API_SECRET}
      - BITGET_API_PASSPHRASE=${BITGET_API_PASSPHRASE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
    networks:
      - ai_xyz_network
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  ai_xyz_network:
    driver: bridge
    name: ai_xyz_trading_network
