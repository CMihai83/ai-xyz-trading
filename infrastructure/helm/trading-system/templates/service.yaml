apiVersion: v1
kind: Service
metadata:
  name: {{ include "trading-system.fullname" . }}-api-gateway
  labels:
    {{- include "trading-system.labels" . | nindent 4 }}
    component: api-gateway
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "trading-system.selectorLabels" . | nindent 4 }}
    component: api-gateway
